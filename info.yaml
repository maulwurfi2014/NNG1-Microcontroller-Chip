# Tiny Tapeout project information
project:
  title: "Notna Nano G1"
  author: "Notna"
  discord: ""
  description: "Compact RV32I microcontroller SoC with GPIO, UART, SPI, I2C, PWM, timers, watchdog, IRQ and QSPI"
  language: "Verilog"
  clock_hz: 10000000
  # Conservative starting size for the current RTL. Final tile count must be
  # confirmed by the IHP/TT implementation flow after synthesis.
  tiles: "8x2"
  top_module: "tt_um_nng1"
  source_files:
    - "tt_um_nng1.v"
    - "nng1.v"
    - "reset_sync.v"
    - "cpu/rv32i_core.v"
    - "memory/bootrom.v"
    - "memory/sram.v"
    - "memory/sram_ihp_1024x32.v"
    - "peripherals/gpio.v"
    - "peripherals/uart.v"
    - "peripherals/spi_master.v"
    - "peripherals/i2c_master.v"
    - "peripherals/pwm.v"
    - "peripherals/timer.v"
    - "peripherals/watchdog.v"
    - "peripherals/irq_controller.v"
    - "peripherals/pad_ctrl.v"
    - "flash/qspi_master.v"
    - "clock/clock_ctrl.v"
  pinout:
    ui[0]: "GPIO_IN0"
    ui[1]: "GPIO_IN1"
    ui[2]: "GPIO_IN2"
    ui[3]: "GPIO_IN3"
    ui[4]: "GPIO_IN4"
    ui[5]: "GPIO_IN5"
    ui[6]: "GPIO_IN6"
    ui[7]: "GPIO_IN7"
    uo[0]: "GPIO_OUT0"
    uo[1]: "GPIO_OUT1"
    uo[2]: "GPIO_OUT2"
    uo[3]: "GPIO_OUT3"
    uo[4]: "GPIO_OUT4"
    uo[5]: "GPIO_OUT5"
    uo[6]: "GPIO_OUT6"
    uo[7]: "GPIO_OUT7"
    uio[0]: "GPIO8 / QSPI_IO0 / SPI_MOSI / I2C_SCL / UART_TX"
    uio[1]: "GPIO9 / QSPI_IO1 / SPI_SCK / I2C_SDA / UART_RX"
    uio[2]: "GPIO10 / QSPI_IO2 / SPI_CS"
    uio[3]: "GPIO11 / QSPI_IO3 / SPI_MISO"
    uio[4]: "GPIO12 / QSPI_CS"
    uio[5]: "GPIO13 / QSPI_SCK"
    uio[6]: "GPIO14"
    uio[7]: "GPIO15"

# Do not change!
yaml_version: 6
